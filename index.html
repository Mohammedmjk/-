<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مستودع سامو للأدوية - نظام التجهيز الذكي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/@html5-qrcode/scanner" type="text/javascript"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f8fafc; }
    </style>
</head>
<body class="text-slate-800">

    <!-- شاشة تسجيل الدخول للمذخر -->
    <div id="loginScreen" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 flex items-center justify-center p-4">
        <div class="bg-white rounded-3xl shadow-2xl w-full max-w-md p-8 border border-slate-100">
            <h2 class="text-2xl font-black text-sky-600 text-center mb-6">🔐 تسجيل دخول مذخر سامو</h2>
            <div class="space-y-4">
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">اسم الموظف أو المسؤول:</label>
                    <input type="text" id="staffNameInput" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none" placeholder="أدخل اسمك الكريم...">
                </div>
                <div>
                    <label class="block text-sm font-bold text-slate-600 mb-1">الرمز السري المعتمد:</label>
                    <input type="password" id="staffPassInput" class="w-full px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl focus:ring-2 focus:ring-sky-500 focus:outline-none" placeholder="••••••••">
                </div>
                <button onclick="loginStaff()" class="w-full py-4 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-xl shadow-lg shadow-sky-500/30 transition-all">دخول للنظام 🚀</button>
            </div>
        </div>
    </div>

    <!-- التطبيق الرئيسي -->
    <div id="appContainer" class="hidden min-h-screen flex flex-col">
        <!-- شريط علوي -->
        <header class="bg-white shadow-sm px-6 py-4 flex justify-between items-center border-b border-slate-100">
            <div class="flex items-center gap-3">
                <span class="text-2xl">💊</span>
                <div>
                    <h1 class="font-black text-lg text-slate-900">مستودع سامو للأدوية</h1>
                    <p class="text-xs text-slate-500">الموظف المجهز: <span id="activeStaffDisplay" class="font-bold text-sky-600"></span></p>
                </div>
            </div>
            <button onclick="fetchData()" class="px-4 py-2 bg-sky-50 hover:bg-sky-100 text-sky-600 font-bold rounded-xl text-sm transition-all flex items-center gap-2">
                🔄 مزامنة السحابة
            </button>
        </header>

        <!-- التبويبات -->
        <div class="flex bg-white border-b border-slate-200 px-6 gap-2">
            <button onclick="switchTab('pos')" id="tabBtn-pos" class="px-6 py-3 font-bold text-sky-600 border-b-2 border-sky-600 transition-all">🛒 تجهيز الصيدليات (POS)</button>
            <button onclick="switchTab('inventory')" id="tabBtn-inventory" class="px-6 py-3 font-bold text-slate-500 hover:text-slate-800 transition-all">📦 إدارة المخزن</button>
            <button onclick="switchTab('orders')" id="tabBtn-orders" class="px-6 py-3 font-bold text-slate-500 hover:text-slate-800 transition-all">📑 الطلبيات المحفوظة</button>
        </div>

        <!-- محتوى التطبيق -->
        <main class="flex-1 p-6 max-w-7xl mx-auto w-full">
            
            <!-- تبويب تجهيز الصيدليات POS -->
            <div id="tab-pos" class="grid grid-cols-1 lg:grid-cols-3 gap-6">
                <!-- قسم السلة وتجهيز الطلبية (يمين) -->
                <div class="lg:col-span-1 bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[70vh]">
                    <h3 class="font-bold text-lg text-sky-600 mb-4 border-b pb-2">🛒 سلة تجهيز الصيدلية</h3>
                    
                    <div class="space-y-3 mb-4">
                        <div>
                            <label class="block text-xs font-bold text-slate-500 mb-1">اسم الصيدلية المستلمة:</label>
                            <input type="text" id="pharmacyNameInput" class="w-full px-3 py-2 bg-slate-50 border border-slate-200 rounded-lg text-sm focus:outline-none focus:ring-1 focus:ring-sky-500" placeholder="مثال: صيدلية النور">
                        </div>
                    </div>

                    <!-- قائمة المواد في السلة -->
                    <div id="cartItemsContainer" class="flex-1 overflow-y-auto space-y-2 border border-slate-100 rounded-xl p-2 bg-slate-50">
                        <!-- تظهر المواد هنا ديناميكياً -->
                        <p class="text-center text-slate-400 text-sm mt-10">السلة فارغة حالياً</p>
                    </div>

                    <!-- الإجمالي وزر الإرسال -->
                    <div class="mt-4 pt-3 border-t border-slate-100">
                        <div class="flex justify-between items-center mb-3">
                            <span class="font-bold text-slate-600">المبلغ الإجمالي:</span>
                            <span id="cartTotalDisplay" class="font-black text-lg text-emerald-600">0 د.ع</span>
                        </div>
                        <button onclick="submitOrder()" class="w-full py-3 bg-emerald-600 hover:bg-emerald-700 text-white font-bold rounded-xl shadow-md shadow-emerald-600/20 transition-all">
                            📤 تثبيت الطلبية وإصدار القائمة
                        </button>
                    </div>
                </div>

                <!-- قسم البحث والبحث بالكاميرا والمنتجات (يسار) -->
                <div class="lg:col-span-2 bg-white p-5 rounded-2xl shadow-sm border border-slate-100 flex flex-col h-[70vh]">
                    <div class="flex gap-3 mb-4">
                        <input type="text" id="posSearchInput" oninput="filterPosProducts()" class="flex-1 px-4 py-3 bg-slate-50 border border-slate-200 rounded-xl text-sm focus:outline-none focus:ring-2 focus:ring-sky-500" placeholder="🔍 ابحث باسم المادة أو امسح الباركود...">
                        <button onclick="toggleScanner()" class="px-4 py-3 bg-slate-800 hover:bg-slate-900 text-white font-bold rounded-xl text-sm transition-all flex items-center gap-2">
                            📷 مسح بالكاميرا
                        </button>
                    </div>

                    <!-- نافذة الكاميرا للباركود -->
                    <div id="scannerContainer" class="hidden mb-4 p-3 bg-slate-900 rounded-2xl relative">
                        <div id="reader" class="w-full rounded-xl overflow-hidden"></div>
                        <button onclick="toggleScanner()" class="absolute top-5 left-5 bg-red-500 text-white px-3 py-1 rounded-lg text-xs font-bold">إغلاق الكاميرا</button>
                    </div>

                    <!-- شبكة الأدوية المتاحة للتجهيز -->
                    <div id="posProductsGrid" class="flex-1 overflow-y-auto grid grid-cols-1 md:grid-cols-2 gap-3 p-1">
                        <!-- تظهر المواد هنا -->
                    </div>
                </div>
            </div>

            <!-- تبويب إدارة المخزن -->
            <div id="tab-inventory" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-lg text-sky-600 mb-4">📦 إدارة المخزن والأدوية الحالية</h3>
                <div id="inventoryListContainer" class="space-y-3">
                    <!-- قائمة الأدوية -->
                </div>
            </div>

            <!-- تبويب الطلبيات المحفوظة -->
            <div id="tab-orders" class="hidden bg-white p-6 rounded-2xl shadow-sm border border-slate-100">
                <h3 class="font-bold text-lg text-sky-600 mb-4">📑 سجل الطلبيات والقوائم الصادرة</h3>
                <div id="ordersListContainer" class="space-y-4">
                    <!-- الطلبيات هنا -->
                </div>
            </div>

        </main>
    </div>

    <script>
        const API_URL = "https://script.google.com/macros/s/AKfycbwT6X3nE6XO-RmcI_p_pSeNVpI4zATH3Hrp5oI-2bql6RLRowDZe_MH6_r99G4Di5ZN/exec";
        
        let inventory = [];
        let orders = [];
        let cart = {};
        let activeStaff = localStorage.getItem('samo_staff') || "";
        let html5QrCode = null;

        window.onload = function() {
            if (activeStaff) {
                document.getElementById('loginScreen').classList.add('hidden');
                document.getElementById('appContainer').classList.remove('hidden');
                document.getElementById('activeStaffDisplay').innerText = activeStaff;
                fetchData();
            }
        };

        function loginStaff() {
            const name = document.getElementById('staffNameInput').value.trim();
            const pass = document.getElementById('staffPassInput').value.trim();
            if(!name || !pass) {
                alert('يرجى إدخال اسم الموظف والرمز السري');
                return;
            }
            activeStaff = name;
            localStorage.setItem('samo_staff', name);
            document.getElementById('loginScreen').classList.add('hidden');
            document.getElementById('appContainer').classList.remove('hidden');
            document.getElementById('activeStaffDisplay').innerText = activeStaff;
            fetchData();
        }

        function switchTab(tabId) {
            ['pos', 'inventory', 'orders'].forEach(t => {
                document.getElementById(`tab-${t}`).classList.add('hidden');
                document.getElementById(`tabBtn-${t}`).className = "px-6 py-3 font-bold text-slate-500 hover:text-slate-800 transition-all";
            });
            document.getElementById(`tab-${tabId}`).classList.remove('hidden');
            document.getElementById(`tabBtn-${tabId}`).className = "px-6 py-3 font-bold text-sky-600 border-b-2 border-sky-600 transition-all";
        }

        async function fetchData() {
            try {
                const res = await fetch(API_URL);
                const data = await res.json();
                if(data) {
                    inventory = data.products || [];
                    orders = data.orders || [];
                    renderPosProducts();
                    renderInventory();
                    renderOrders();
                }
            } catch(e) {
                console.error("خطأ في جلب البيانات:", e);
            }
        }

        function renderPosProducts(filteredList = null) {
            const container = document.getElementById('posProductsGrid');
            container.innerHTML = '';
            const list = filteredList || inventory;

            if(list.length === 0) {
                container.innerHTML = '<p class="text-slate-400 text-center col-span-2 py-10">لا توجد مواد مطابقة</p>';
                return;
            }

            list.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-3 bg-slate-50 border border-slate-100 rounded-xl flex justify-between items-center hover:border-sky-300 transition-all";
                div.innerHTML = `
                    <div>
                        <h4 class="font-bold text-slate-800 text-sm">${item.name}</h4>
                        <p class="text-xs text-sky-600 font-semibold">${item.price} د.ع | المتوفر: ${item.quantity}</p>
                    </div>
                    <button onclick="addToCart('${item.id || item.name}', '${item.name}', ${item.price})" class="px-3 py-1.5 bg-sky-600 hover:bg-sky-700 text-white font-bold rounded-lg text-xs transition-all">+ إضافة</button>
                `;
                container.appendChild(div);
            });
        }

        function filterPosProducts() {
            const query = document.getElementById('posSearchInput').value.trim().toLowerCase();
            const filtered = inventory.filter(i => (i.name && i.name.toLowerCase().includes(query)) || (i.barcode && i.barcode.toString().toLowerCase().includes(query)));
            renderPosProducts(filtered);
        }

        function addToCart(id, name, price) {
            if(cart[id]) {
                cart[id].qty += 1;
            } else {
                cart[id] = { id, name, price, qty: 1 };
            }
            renderCart();
        }

        function renderCart() {
            const container = document.getElementById('cartItemsContainer');
            container.innerHTML = '';
            let total = 0;

            const keys = Object.keys(cart);
            if(keys.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 text-sm mt-10">السلة فارغة حالياً</p>';
                document.getElementById('cartTotalDisplay').innerText = "0 د.ع";
                return;
            }

            keys.forEach(k => {
                const item = cart[k];
                const subTotal = item.price * item.qty;
                total += subTotal;

                const div = document.createElement('div');
                div.className = "flex justify-between items-center p-2 bg-white rounded-lg border border-slate-100 text-xs";
                div.innerHTML = `
                    <div>
                        <span class="font-bold text-slate-800">${item.name}</span>
                        <span class="text-slate-400 block">${item.price} د.ع × ${item.qty}</span>
                    </div>
                    <div class="flex items-center gap-2">
                        <span class="font-black text-sky-600">${subTotal} د.ع</span>
                        <button onclick="changeQty('${k}', 1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded font-bold">+</button>
                        <button onclick="changeQty('${k}', -1)" class="w-6 h-6 bg-slate-100 hover:bg-slate-200 rounded font-bold">-</button>
                    </div>
                `;
                container.appendChild(div);
            });

            document.getElementById('cartTotalDisplay').innerText = total.toLocaleString() + " د.ع";
        }

        function changeQty(id, delta) {
            if(cart[id]) {
                cart[id].qty += delta;
                if(cart[id].qty <= 0) delete cart[id];
                renderCart();
            }
        }

        function submitOrder() {
            const phName = document.getElementById('pharmacyNameInput').value.trim();
            if(!phName) {
                alert('يرجى كتابة اسم الصيدلية المستلمة');
                return;
            }
            if(Object.keys(cart).length === 0) {
                alert('السلة فارغة');
                return;
            }

            const itemsList = Object.values(cart);
            const totalAmount = itemsList.reduce((acc, curr) => acc + (curr.price * curr.qty), 0);

            const newOrder = {
                orderNumber: "ORD-" + (orders.length + 1001),
                pharmacyName: phName,
                totalAmount: totalAmount,
                status: "مكتملة ومجهزة",
                staffName: activeStaff,
                items: itemsList
            };

            orders.unshift(newOrder);
            cart = {};
            document.getElementById('pharmacyNameInput').value = '';
            renderCart();
            renderOrders();
            alert('تم تثبيت الطلبية بنجاح وإصدار القائمة!');
            switchTab('orders');
        }

        function renderInventory() {
            const container = document.getElementById('inventoryListContainer');
            container.innerHTML = '';
            inventory.forEach(item => {
                const div = document.createElement('div');
                div.className = "p-3 bg-slate-50 border border-slate-100 rounded-xl flex justify-between items-center";
                div.innerHTML = `
                    <span class="font-bold text-slate-800">${item.name}</span>
                    <span class="text-sm font-semibold text-sky-600">السعر: ${item.price} د.ع | المتوفر: ${item.quantity}</span>
                `;
                container.appendChild(div);
            });
        }

        function renderOrders() {
            const container = document.getElementById('ordersListContainer');
            container.innerHTML = '';
            orders.forEach(o => {
                const div = document.createElement('div');
                div.className = "p-4 bg-slate-50 border border-slate-100 rounded-xl";
                div.innerHTML = `
                    <div class="flex justify-between font-bold text-sm mb-2">
                        <span>رقم الطلب: ${o.orderNumber} | الصيدلية: ${o.pharmacyName}</span>
                        <span class="text-emerald-600">${o.totalAmount.toLocaleString()} د.ع</span>
                    </div>
                    <p class="text-xs text-slate-500">الموظف المجهز: ${o.staffName} | الحالة: ${o.status}</p>
                `;
                container.appendChild(div);
            });
        }

        // مسح الباركود بالكاميرا
        function toggleScanner() {
            const scannerDiv = document.getElementById('scannerContainer');
            if(scannerDiv.classList.contains('hidden')) {
                scannerDiv.classList.remove('hidden');
                html5QrCode = new Html5Qrcode("reader");
                html5QrCode.start(
                    { facingMode: "environment" },
                    { fps: 10, qrbox: 250 },
                    qrCodeMessage => {
                        document.getElementById('posSearchInput').value = qrCodeMessage;
                        filterPosProducts();
                        toggleScanner();
                    },
                    errorMessage => {}
                ).catch(err => { console.error(err); });
            } else {
                if(html5QrCode) {
                    html5QrCode.stop().then(() => {
                        scannerDiv.classList.add('hidden');
                    }).catch(err => console.log(err));
                } else {
                    scannerDiv.classList.add('hidden');
                }
            }
        }
    </script>
</body>
</html>
